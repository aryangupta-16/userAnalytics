version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: user-analytics-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=user_analytics

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: user-analytics-server
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://root:example@mongodb:27017/user_analytics?authSource=admin
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: user-analytics-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  mongodb_data:
